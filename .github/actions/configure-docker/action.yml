name: 'Configure Docker'
description: 'Set up Docker build driver and configure build cache args'
inputs:
  use-warp:
    description: 'Use cirrus cache'
    required: true
outputs:
  buildx-image-hit:
    description: 'Whether the Buildx image tarball was restored'
    value: ${{ steps.buildx-image.outputs.cache-hit }}
runs:
  using: 'composite'
  steps:
    # Each runner is a new VM. buildx-warm saves this tarball; later jobs load it.
    - name: Restore Buildx image
      id: buildx-image
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/buildx-buildkit.tar
        key: buildx-moby-buildkit-${{ runner.os }}-${{ runner.arch }}

    - name: Load Buildx image
      if: steps.buildx-image.outputs.cache-hit == 'true'
      continue-on-error: true
      shell: bash
      run: docker load -i "${RUNNER_TEMP}/buildx-buildkit.tar"

    - name: Set up Docker Buildx
      id: buildx
      continue-on-error: true
      uses: docker/setup-buildx-action@v3
      with:
        # Use host network to allow access to cirrus gha cache running on the host
        driver-opts: |
          network=host

    # Docker Hub 500 on moby/buildkit is not a suite failure. One retry.
    - name: Set up Docker Buildx (retry)
      if: steps.buildx.outcome == 'failure'
      uses: docker/setup-buildx-action@v3
      with:
        driver-opts: |
          network=host

    # This is required to allow buildkit to access the actions cache
    - name: Expose actions cache variables
      uses: actions/github-script@v8
      with:
        script: |
          Object.keys(process.env).forEach(function (key) {
            if (key.startsWith('ACTIONS_')) {
              core.info(`Exporting ${key}`);
              core.exportVariable(key, process.env[key]);
            }
          });

    - name: Construct docker build cache args
      shell: bash
      run: |
        # Configure docker build cache backend
        #
        # On forks the gha cache will work but will use Github's cache backend.
        # Docker will check for variables $ACTIONS_CACHE_URL, $ACTIONS_RESULTS_URL and $ACTIONS_RUNTIME_TOKEN
        # which are set automatically when running on GitHub infra: https://docs.docker.com/build/cache/backends/gha/#synopsis

        url_args=""

        # Always optimistically --cache‑from in case a cache blob exists
        args=(--cache-from "type=gha${url_args:+,${url_args}},scope=${CONTAINER_NAME}")

        # A pull-request cache is scoped to that pull request and is not
        # visible to the next one. A push to the default branch is the cache
        # every later pull request can restore. Warp is not required for the
        # GitHub Actions cache backend.
        if [[ ${{ github.event_name }} == "push" && ${{ github.ref_name }} == ${{ github.event.repository.default_branch }} ]]; then
          args+=(--cache-to "type=gha${url_args:+,${url_args}},mode=max,ignore-error=true,scope=${CONTAINER_NAME}")
        fi

        # Always `--load` into docker images (needed when using the `docker-container` build driver).
        args+=(--load)

        echo "DOCKER_BUILD_CACHE_ARG=${args[*]}" >> $GITHUB_ENV
