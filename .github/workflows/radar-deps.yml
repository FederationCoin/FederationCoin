name: radar-deps

on:
  push:
    branches:
      - 29.x-federationcoin

permissions:
  contents: read

jobs:
  radar-deps:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install osv-scanner
        run: |
          set -eu
          curl -fsSL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -o /usr/local/bin/osv-scanner
          chmod +x /usr/local/bin/osv-scanner
      - name: Scan
        run: osv-scanner --format json --recursive . > radar-deps-osv.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: radar-deps
          path: radar-deps-osv.json
          if-no-files-found: error
          retention-days: 30
