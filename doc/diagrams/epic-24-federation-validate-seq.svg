<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200">
  <title>FederationCoin - check a block</title>
  <rect width="900" height="1200" fill="#FFF6E8"/>
  <text x="450" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#1B2838">FederationCoin checks a block</text>
  <text x="450" y="62" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#5C4A2A">Same walk. Gray is the same. Blue is a change. Green is new.</text>

  <rect x="288" y="72" width="52" height="18" rx="4" fill="#E4E2DC" stroke="#8A8680" stroke-width="1"/>
  <text x="314" y="85" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1B2838">same</text>
  <rect x="352" y="72" width="72" height="18" rx="4" fill="#C5D8F0" stroke="#2B5A8A" stroke-width="1"/>
  <text x="388" y="85" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1B2838">changed</text>
  <rect x="436" y="72" width="52" height="18" rx="4" fill="#C8E6D4" stroke="#2D6A4F" stroke-width="1"/>
  <text x="462" y="85" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1B2838">new</text>
  <text x="548" y="85" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5C4A2A">the required fee</text>

  <rect x="40" y="100" width="100" height="36" rx="8" fill="#E4E2DC" stroke="#1B2838" stroke-width="1.5"/>
  <text x="90" y="124" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1B2838">Peer</text>
  <rect x="680" y="100" width="180" height="36" rx="8" fill="#1B2838"/>
  <text x="770" y="124" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFF6E8">FederationCoin node</text>

  <line x1="90" y1="136" x2="90" y2="760" stroke="#8A7A5C" stroke-width="1.5" stroke-dasharray="4 6"/>
  <line x1="770" y1="136" x2="770" y2="760" stroke="#8A7A5C" stroke-width="1.5" stroke-dasharray="4 6"/>

  <text x="430" y="156" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#5C4A2A">here is a block</text>
  <line x1="90" y1="168" x2="754" y2="168" stroke="#1B2838" stroke-width="2"/>
  <polygon points="754,163 770,168 754,173" fill="#1B2838"/>

  <rect x="150" y="186" width="600" height="52" rx="10" fill="#C5D8F0" stroke="#2B5A8A" stroke-width="1.5"/>
  <text x="450" y="208" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1B2838">1. Read the header</text>
  <text x="450" y="228" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3D3424">Version 2, 164 bytes.</text>

  <rect x="150" y="248" width="600" height="52" rx="10" fill="#C5D8F0" stroke="#2B5A8A" stroke-width="1.5"/>
  <text x="450" y="270" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1B2838">2. Was the work hard enough?</text>
  <text x="450" y="290" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3D3424">Blake2b</text>

  <rect x="150" y="310" width="600" height="44" rx="10" fill="#E4E2DC" stroke="#8A8680" stroke-width="1.25"/>
  <text x="450" y="338" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1B2838">3. Do we have the last block?</text>

  <rect x="150" y="364" width="600" height="68" rx="10" fill="#E4E2DC" stroke="#8A8680" stroke-width="1.25"/>
  <text x="450" y="386" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1B2838">4. Do the payments match the fingerprint?</text>
  <text x="450" y="406" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3D3424">The merkle root is a short fingerprint of every payment listed.</text>
  <text x="450" y="424" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3D3424">If someone swapped a payment, it would not match.</text>

  <rect x="150" y="442" width="600" height="52" rx="10" fill="#C5D8F0" stroke="#2B5A8A" stroke-width="1.5"/>
  <text x="450" y="464" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1B2838">5. Does the block fit the max block size?</text>
  <text x="450" y="484" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3D3424">Starts at 2.4M. Grows only when blocks are pegged to the limit, 80% of the ~4.8y interval.</text>

  <rect x="150" y="504" width="600" height="52" rx="10" fill="#E4E2DC" stroke="#8A8680" stroke-width="1.25"/>
  <text x="450" y="526" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1B2838">6. First payment is the miner reward</text>
  <text x="450" y="546" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3D3424">The new coins in that reward cannot be too big.</text>

  <rect x="150" y="566" width="600" height="56" rx="10" fill="#C5D8F0" stroke="#2B5A8A" stroke-width="1.5"/>
  <text x="450" y="588" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1B2838">7. Each payment: script and signature</text>
  <text x="450" y="608" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3D3424">Native SegWit, Dilithium 44, Dilithium 87</text>

  <rect x="150" y="632" width="600" height="52" rx="10" fill="#C8E6D4" stroke="#2D6A4F" stroke-width="1.5"/>
  <text x="450" y="654" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1B2838">8. Each payment pays a small required fee</text>
  <text x="450" y="674" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3D3424">At least one token per 12 virtual bytes, rounded down. A cheap fee fails the block.</text>

  <rect x="150" y="694" width="600" height="52" rx="10" fill="#E4E2DC" stroke="#8A8680" stroke-width="1.25"/>
  <text x="450" y="716" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1B2838">Those coins exist and were not spent twice</text>
  <text x="450" y="736" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3D3424">Last check. The coins are real and unspent.</text>

  <text x="430" y="768" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#5C4A2A">keep it, or hang up</text>
  <line x1="770" y1="780" x2="106" y2="780" stroke="#1B2838" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="106,775 90,780 106,785" fill="#1B2838"/>

  <text x="450" y="808" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#5C4A2A">Arbitrary data paths are closed.</text>

  <rect x="80" y="828" width="740" height="348" rx="10" fill="#FFFFFF" stroke="#1B2838" stroke-width="1.5"/>
  <rect x="80" y="828" width="740" height="40" rx="10" fill="#1B2838"/>
  <rect x="80" y="848" width="740" height="20" fill="#1B2838"/>
  <text x="450" y="854" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#FFF6E8">Max block size</text>

  <text x="220" y="896" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1B2838">At the coin-halving (~4.8 years)</text>
  <text x="620" y="896" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1B2838">What happens to the max</text>
  <line x1="100" y1="908" x2="800" y2="908" stroke="#1B2838" stroke-width="1"/>

  <rect x="90" y="916" width="720" height="48" fill="#FFF6E8"/>
  <text x="250" y="936" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1B2838">Completely pegged to the limit</text>
  <text x="250" y="954" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3D3424">80% of the ~4.8 year interval</text>
  <text x="620" y="946" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1B2838">Grow the max by half</text>

  <rect x="90" y="964" width="720" height="48" fill="#E4E2DC"/>
  <text x="250" y="984" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1B2838">Lots of slack (below 20% weight)</text>
  <text x="250" y="1002" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3D3424">80% of that ~4.8 year interval</text>
  <text x="620" y="994" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1B2838">Cut the max in half (not below 2.4M)</text>

  <rect x="90" y="1012" width="720" height="40" fill="#FFF6E8"/>
  <text x="250" y="1038" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1B2838">In between</text>
  <text x="620" y="1038" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1B2838">Leave the max as it is</text>

  <rect x="90" y="1052" width="720" height="40" fill="#E4E2DC"/>
  <text x="250" y="1078" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1B2838">The next max would break the math</text>
  <text x="620" y="1078" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1B2838">Do not grow the max</text>

  <text x="450" y="1136" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#5C4A2A">Pegged means hit the max. Fees are the fight to get in. After a cut, slack blocks sit at about 40% of the new max.</text>
  <text x="450" y="1158" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#5C4A2A">A stable load does not bounce. Starts at 2.4M. 80% of 210,000 blocks is 168,000 pegged or slack.</text>
</svg>
