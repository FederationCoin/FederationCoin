<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1240" viewBox="0 0 900 1240">
  <title>FederationCoin - check a block</title>
  <rect width="900" height="1240" fill="#FFF6E8"/>
  <text x="450" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#1B2838">FederationCoin checks a block</text>
  <text x="450" y="68" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#5C4A2A">Same walk as Bitcoin. Gold is what we changed.</text>

  <rect x="40" y="88" width="100" height="36" rx="8" fill="#F4D78A" stroke="#1B2838" stroke-width="1.5"/>
  <text x="90" y="112" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1B2838">Peer</text>
  <rect x="680" y="88" width="180" height="36" rx="8" fill="#1B2838"/>
  <text x="770" y="112" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFF6E8">FederationCoin node</text>

  <line x1="90" y1="124" x2="90" y2="800" stroke="#8A7A5C" stroke-width="1.5" stroke-dasharray="4 6"/>
  <line x1="770" y1="124" x2="770" y2="800" stroke="#8A7A5C" stroke-width="1.5" stroke-dasharray="4 6"/>

  <text x="430" y="148" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#5C4A2A">here is a block</text>
  <line x1="90" y1="160" x2="754" y2="160" stroke="#1B2838" stroke-width="2"/>
  <polygon points="754,155 770,160 754,165" fill="#1B2838"/>

  <rect x="150" y="178" width="600" height="52" rx="10" fill="#F4D78A" stroke="#1B2838" stroke-width="1.25"/>
  <text x="450" y="200" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1B2838">1. Read the header</text>
  <text x="450" y="220" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3D3424">Version 2. A bit longer than Bitcoin (164 bytes).</text>

  <rect x="150" y="240" width="600" height="52" rx="10" fill="#C8E6D4" stroke="#1B2838" stroke-width="1.25"/>
  <text x="450" y="262" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1B2838">2. Was the work hard enough?</text>
  <text x="450" y="282" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3D3424">Blake2b hash. This is the lock, not the clock.</text>

  <rect x="150" y="302" width="600" height="52" rx="10" fill="#D6E4F0" stroke="#1B2838" stroke-width="1.25"/>
  <text x="450" y="324" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1B2838">3. Do we have the last block?</text>
  <text x="450" y="344" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3D3424">Not dated in the future. A long wait does not fail the block.</text>

  <rect x="150" y="364" width="600" height="68" rx="10" fill="#F3E2C4" stroke="#1B2838" stroke-width="1.25"/>
  <text x="450" y="386" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1B2838">4. Do the payments match the fingerprint?</text>
  <text x="450" y="406" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3D3424">The merkle root is a short fingerprint of every payment listed.</text>
  <text x="450" y="424" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3D3424">If someone swapped a payment, it would not match.</text>

  <rect x="150" y="442" width="600" height="52" rx="10" fill="#F4D78A" stroke="#1B2838" stroke-width="1.25"/>
  <text x="450" y="464" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1B2838">5. Does the block fit the room?</text>
  <text x="450" y="484" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3D3424">Room starts at 2.4M. It can grow or shrink (table below).</text>

  <rect x="150" y="504" width="600" height="52" rx="10" fill="#D6E4F0" stroke="#1B2838" stroke-width="1.25"/>
  <text x="450" y="526" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1B2838">6. First payment is the miner reward</text>
  <text x="450" y="546" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3D3424">The new coins in that reward cannot be too big.</text>

  <rect x="150" y="566" width="600" height="86" rx="10" fill="#F4D78A" stroke="#1B2838" stroke-width="1.25"/>
  <text x="450" y="588" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1B2838">7. Each payment is a named kind, with a real signature</text>
  <text x="450" y="608" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3D3424">SegWit (BIP 141), Dilithium 44, or Dilithium 87.</text>
  <text x="450" y="626" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3D3424">SegWit uses the old Bitcoin curve (secp256k1). That is the math, not a fourth wallet.</text>
  <text x="450" y="644" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3D3424">No Taproot. No leftover unlock item (that would be a hidden data pocket).</text>

  <rect x="150" y="662" width="600" height="52" rx="10" fill="#F2B8A0" stroke="#1B2838" stroke-width="1.25"/>
  <text x="450" y="684" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1B2838">8. Each payment pays a small required fee</text>
  <text x="450" y="704" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3D3424">At least one token per 12 virtual bytes, rounded down. A cheap fee fails the block.</text>

  <rect x="150" y="724" width="600" height="52" rx="10" fill="#C8E6D4" stroke="#1B2838" stroke-width="1.25"/>
  <text x="450" y="746" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1B2838">9. Those coins exist and were not spent twice</text>
  <text x="450" y="766" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3D3424">Same last check as Bitcoin. One step later, because the fee is required.</text>

  <text x="430" y="800" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#5C4A2A">keep it, or hang up</text>
  <line x1="770" y1="812" x2="106" y2="812" stroke="#1B2838" stroke-width="2" stroke-dasharray="5 4"/>
  <polygon points="106,807 90,812 106,817" fill="#1B2838"/>

  <rect x="80" y="836" width="740" height="72" rx="10" fill="#FFE08A" stroke="#8A5A00" stroke-width="2"/>
  <text x="450" y="862" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#5A3A00">If a block is late</text>
  <text x="450" y="884" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#5A3A00">Ask for more confirmations. That history is cheaper to re-mine. Not a fail.</text>
  <text x="450" y="900" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#5A3A00">After new coins stop, a block is only worth mining if someone paid. Gaps are normal.</text>

  <rect x="80" y="928" width="740" height="280" rx="10" fill="#FFFFFF" stroke="#1B2838" stroke-width="1.5"/>
  <rect x="80" y="928" width="740" height="40" rx="10" fill="#1B2838"/>
  <rect x="80" y="948" width="740" height="20" fill="#1B2838"/>
  <text x="450" y="954" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#FFF6E8">Room (step 5)</text>

  <text x="160" y="996" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1B2838">When</text>
  <text x="560" y="996" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1B2838">What happens</text>
  <line x1="100" y1="1008" x2="800" y2="1008" stroke="#1B2838" stroke-width="1"/>

  <rect x="90" y="1016" width="720" height="40" fill="#FFF6E8"/>
  <text x="250" y="1042" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1B2838">13 of 16 stretches mostly full</text>
  <text x="620" y="1042" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1B2838">Grow the room by half</text>

  <rect x="90" y="1056" width="720" height="40" fill="#F3E2C4"/>
  <text x="250" y="1082" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1B2838">The epoch was quiet (under 20% full)</text>
  <text x="620" y="1082" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1B2838">Cut the room in half (not below 2.4M)</text>

  <rect x="90" y="1096" width="720" height="40" fill="#FFF6E8"/>
  <text x="250" y="1122" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1B2838">In between</text>
  <text x="620" y="1122" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1B2838">Leave the room as it is</text>

  <rect x="90" y="1136" width="720" height="40" fill="#F3E2C4"/>
  <text x="250" y="1162" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1B2838">A grow would break the math</text>
  <text x="620" y="1162" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1B2838">Do not grow</text>

  <text x="450" y="1214" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#5C4A2A">Floor 2.4M. Checked once per coin-halving epoch, not every block.</text>
</svg>
